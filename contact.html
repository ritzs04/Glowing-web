<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        <section>
            <h2>Contact Information</h2>
            <p>Email: contact@glowingweb.com</p>
            <p>Phone: +1 (234) 567-8901</p>
            <p>Address: 123 Glow Lane, Shine City, SC 12345</p>
        </section>
        <section>
            <h2>Inquiry Form</h2>
            <form action="/submit-form" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <br>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section>
            <h2>Communication Channels</h2>
            <ul>
                <li><a href="https://www.facebook.com/glowingweb">Facebook</a></li>
                <li><a href="https://twitter.com/glowingweb">Twitter</a></li>
                <li><a href="https://www.instagram.com/glowingweb">Instagram</a></li>
                <li><a href="https://www.linkedin.com/company/glowingweb">LinkedIn</a></li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Glowing Web. All rights reserved.</p>
    </footer>
</body>
</html>
